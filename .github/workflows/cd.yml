name: CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_OWNER_ID=${{ secrets.NEXT_PUBLIC_OWNER_ID }}
            NEXT_PUBLIC_KAKAO_JavaScript_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_JavaScript_KEY }}
            NEXT_PUBLIC_KAKAO_CHANNEL_ID=${{ secrets.NEXT_PUBLIC_KAKAO_CHANNEL_ID }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      # 자동으로 이미지를 pull하고 테스트/실행
      - name: Pull and test Docker image
        if: github.event_name != 'pull_request'
        run: |
          echo "🚀 Pulling Docker image from GitHub Container Registry..."
          # 이미 로그인되어 있지만, 확실하게 하기 위해 다시 확인
          # GITHUB_TOKEN은 GitHub Actions에서 자동으로 제공됨 (별도 설정 불필요)
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # 빌드된 이미지 태그 사용 (소문자로 자동 변환됨)
          IMAGE_TAG="${{ steps.meta.outputs.tags }}"
          echo "📦 Pulling image: $IMAGE_TAG"
          docker pull $IMAGE_TAG
          
          echo "✅ Image pulled successfully!"
          echo "📦 Image details:"
          docker images | grep "$(echo $IMAGE_TAG | cut -d':' -f1)"
          
          echo "🧪 Testing Docker image..."
          docker run -d -p 3000:3000 --name test-container $IMAGE_TAG
          
          echo "⏳ Waiting for container to start..."
          sleep 15
          
          echo "📊 Checking container status..."
          docker ps | grep test-container || echo "⚠️ Container not found in running list"
          
          echo "📝 Container logs:"
          docker logs test-container || echo "⚠️ Could not retrieve logs"
          
          echo "🧹 Cleaning up test container..."
          docker stop test-container || true
          docker rm test-container || true
          
          echo "✅ Docker image test completed successfully!"